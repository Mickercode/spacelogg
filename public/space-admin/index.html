<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Owner Dashboard — SpaceLogg</title>
<link rel="icon" type="image/png" sizes="32x32" href="/branding/spacelogg-favicon-32.png"/>
<link rel="icon" type="image/svg+xml" href="/branding/spacelogg-icon.svg"/>
<link rel="stylesheet" href="/css/main.css"/>
<style>
body{padding-top:64px;background:var(--parchment);}
.owner-wrap{max-width:1100px;margin:0 auto;padding:2rem 2rem 5rem;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
.stat-num{font-family:'DM Serif Display',serif;font-size:32px;color:var(--charcoal);line-height:1;}
.stat-num.amber{color:var(--amber);}
.stat-num.green{color:var(--green);}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px;}
.panel{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.5rem;}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap;gap:.75rem;}
.panel-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--charcoal);}
.otable{width:100%;border-collapse:collapse;}
.otable th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);padding:.75rem 1.25rem;border-bottom:0.5px solid var(--border);font-weight:500;white-space:nowrap;}
.otable td{padding:.875rem 1.25rem;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--text-secondary);vertical-align:middle;}
.otable tr:last-child td{border-bottom:none;}
.otable tr:hover td{background:var(--parchment-light);}
.today-card{background:var(--charcoal);color:#fff;border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:2rem;}
.today-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.5;margin-bottom:0.5rem;}
.today-count{font-family:'DM Serif Display',serif;font-size:36px;line-height:1;}
.today-list{margin-top:1rem;}
.today-item{display:flex;justify-content:space-between;padding:8px 0;border-top:0.5px solid rgba(255,255,255,0.1);font-size:13px;}
.today-item:first-child{border-top:none;}
.revenue-card{background:linear-gradient(135deg,var(--amber),#D47B15);color:#fff;border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:2rem;}
</style>
</head>
<body>
<nav style="background:rgba(28,26,22,0.97);">
  <a href="/space-admin/" class="nav-logo">
    <div class="nav-logomark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="5" stroke="#1C1A16" stroke-width="2"/><circle cx="12" cy="10" r="2" fill="#1C1A16"/><path d="M12 15L12 22" stroke="#1C1A16" stroke-width="2" stroke-linecap="round"/><path d="M8 21Q12 18.5 16 21" stroke="#1C1A16" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></div>
    <div class="nav-wordmark" style="color:#fff;">Space<span>Logg</span></div>
  </a>
  <div class="nav-right">
    <div class="nav-links">
      <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:500;">Owner Dashboard</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="owner-name" style="font-size:13px;color:rgba(255,255,255,0.5);"></span>
      <button onclick="ownerLogout()" class="btn btn-outline btn-sm" style="color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2);">Sign out</button>
    </div>
  </div>
</nav>

<div class="owner-wrap">
  <div style="margin-bottom:2rem;">
    <div class="section-eyebrow">Welcome back</div>
    <h1 class="section-title" id="greeting">Dashboard</h1>
  </div>

  <!-- TODAY'S BOOKINGS -->
  <div class="today-card">
    <div class="today-title">Today's bookings</div>
    <div class="today-count" id="today-count">—</div>
    <div class="today-list" id="today-list"></div>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">Loading…</div></div>
  </div>

  <!-- REVENUE -->
  <div class="revenue-card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
      <div>
        <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:4px;">Total Revenue</div>
        <div id="total-revenue" style="font-family:'DM Serif Display',serif;font-size:36px;">...</div>
      </div>
      <div>
        <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:4px;">This Month</div>
        <div id="monthly-revenue" style="font-family:'DM Serif Display',serif;font-size:28px;">...</div>
      </div>
      <div>
        <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:4px;">Pending Payout</div>
        <div id="pending-payout" style="font-family:'DM Serif Display',serif;font-size:28px;">...</div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('bookings',this)">Bookings</button>
    <button class="tab-btn" onclick="switchTab('spaces',this)">My Spaces</button>
    <button class="tab-btn" onclick="switchTab('reviews',this)">Reviews</button>
  </div>

  <!-- BOOKINGS TAB -->
  <div class="tab-pane active" id="tab-bookings">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">All bookings</span>
        <select class="form-select" id="booking-filter" style="width:150px;padding:7px 12px;font-size:13px;" onchange="loadBookings()">
          <option value="">All statuses</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending_payment">Pending payment</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table class="otable"><thead><tr><th>Space</th><th>Guest</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th></tr></thead>
        <tbody id="bookings-body"></tbody></table>
      </div>
      <div id="bookings-empty" style="display:none;padding:2rem;text-align:center;color:var(--text-muted);">No bookings yet.</div>
    </div>
  </div>

  <!-- SPACES TAB -->
  <div class="tab-pane" id="tab-spaces">
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Your spaces on SpaceLogg</span></div>
      <div style="overflow-x:auto;">
        <table class="otable"><thead><tr><th>Name</th><th>Category</th><th>Area</th><th>Price</th><th>Rating</th><th>Status</th></tr></thead>
        <tbody id="spaces-body"></tbody></table>
      </div>
    </div>
  </div>

  <!-- REVIEWS TAB -->
  <div class="tab-pane" id="tab-reviews">
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Recent reviews</span></div>
      <div id="reviews-list"></div>
      <div id="reviews-empty" style="display:none;padding:2rem;text-align:center;color:var(--text-muted);">No reviews yet.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const API = '/api';
let ownerToken = localStorage.getItem('sl_token');
let ownerUser = JSON.parse(localStorage.getItem('sl_user') || 'null');

async function ownerFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + ownerToken, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function fmtMoney(kobo) {
  return '₦' + (kobo / 100).toLocaleString('en', { minimumFractionDigits: 0 });
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

function ownerLogout() {
  localStorage.removeItem('sl_token');
  localStorage.removeItem('sl_user');
  window.location.href = '/space-admin/login.html';
}

async function init() {
  if (!ownerToken || !ownerUser) { window.location.href = '/space-admin/login.html'; return; }
  // Verify access
  try {
    const { user } = await ownerFetch('/auth/me');
    if (user.role !== 'owner' && user.role !== 'admin') throw new Error('Not an owner');
    ownerUser = user;
  } catch { ownerLogout(); return; }

  document.getElementById('owner-name').textContent = ownerUser.name;
  document.getElementById('greeting').textContent = `Hi, ${ownerUser.name.split(' ')[0]}`;

  loadToday();
  loadStats();
  loadRevenue();
  loadBookings();
}

async function loadToday() {
  try {
    const { bookings, date } = await ownerFetch('/owner/today');
    document.getElementById('today-count').textContent = bookings.length;
    if (!bookings.length) {
      document.getElementById('today-list').innerHTML = '<div style="font-size:13px;opacity:0.5;">No bookings scheduled for today.</div>';
      return;
    }
    document.getElementById('today-list').innerHTML = bookings.map(b =>
      `<div class="today-item"><span>${b.space_name} — ${b.user_name}</span><span>${b.start_time}–${b.end_time}</span></div>`
    ).join('');
  } catch {}
}

async function loadStats() {
  try {
    const s = await ownerFetch('/owner/stats');
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card"><div class="stat-num">${s.totalSpaces}</div><div class="stat-label">Spaces</div></div>
      <div class="stat-card"><div class="stat-num green">${s.totalBookings}</div><div class="stat-label">Total bookings</div></div>
      <div class="stat-card"><div class="stat-num amber">${s.upcomingBookings}</div><div class="stat-label">Upcoming</div></div>
      <div class="stat-card"><div class="stat-num">${s.totalReviews}</div><div class="stat-label">Reviews</div></div>`;
  } catch {}
}

async function loadRevenue() {
  try {
    const r = await ownerFetch('/owner/revenue');
    document.getElementById('total-revenue').textContent = fmtMoney(r.totalRevenue);
    document.getElementById('monthly-revenue').textContent = fmtMoney(r.monthlyRevenue);
    document.getElementById('pending-payout').textContent = fmtMoney(r.pendingPayout);
  } catch {}
}

async function loadBookings() {
  try {
    const filter = document.getElementById('booking-filter').value;
    const { bookings } = await ownerFetch('/owner/bookings' + (filter ? '?status=' + filter : ''));
    const tbody = document.getElementById('bookings-body');
    const empty = document.getElementById('bookings-empty');
    if (!bookings.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = bookings.map(b => `
      <tr>
        <td style="font-weight:500;color:var(--charcoal);">${b.space_name}</td>
        <td><div style="font-weight:500;">${b.user_name}</div><div style="font-size:11px;color:var(--text-muted);">${b.user_email}</div></td>
        <td style="white-space:nowrap;">${b.date}</td>
        <td style="white-space:nowrap;">${b.start_time}–${b.end_time}</td>
        <td>${b.guests}</td>
        <td><span class="status-badge status-${b.status==='confirmed'?'approved':b.status==='cancelled'?'rejected':'pending'}">${b.status}</span></td>
      </tr>`).join('');
  } catch {}
}

async function loadSpaces() {
  try {
    const { spaces } = await ownerFetch('/owner/spaces');
    document.getElementById('spaces-body').innerHTML = spaces.map(s => `
      <tr>
        <td style="font-weight:500;color:var(--charcoal);">${s.name}</td>
        <td>${s.category}</td>
        <td>${s.area || s.city}</td>
        <td>${s.price || 'Free'} ${s.price_unit || ''}</td>
        <td>★ ${s.rating || '—'} (${s.review_count || 0})</td>
        <td><span class="status-badge status-${s.status==='approved'?'approved':'pending'}">${s.status}</span></td>
      </tr>`).join('');
  } catch {}
}

async function loadReviews() {
  try {
    const { reviews } = await ownerFetch('/owner/reviews');
    const list = document.getElementById('reviews-list');
    const empty = document.getElementById('reviews-empty');
    if (!reviews.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = reviews.map(r => `
      <div style="padding:1rem 1.5rem;border-bottom:0.5px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <div style="font-weight:500;font-size:14px;color:var(--charcoal);">${r.user_name}</div>
          <div style="color:var(--amber);font-size:14px;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">${r.space_name} · ${new Date(r.created_at).toLocaleDateString()}</div>
        ${r.comment ? `<div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${r.comment}</div>` : ''}
      </div>`).join('');
  } catch {}
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  el.classList.add('active');
  if (tab === 'bookings') loadBookings();
  if (tab === 'spaces') loadSpaces();
  if (tab === 'reviews') loadReviews();
}

init();
</script>
</body>
</html>
