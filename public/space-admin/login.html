<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Owner Login — SpaceLogg</title>
<link rel="icon" type="image/png" sizes="32x32" href="/branding/spacelogg-favicon-32.png"/>
<link rel="icon" type="image/svg+xml" href="/branding/spacelogg-icon.svg"/>
<link rel="stylesheet" href="/css/main.css"/>
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--charcoal);}
.login-card{background:#fff;border-radius:var(--radius-lg);padding:3rem;max-width:420px;width:100%;text-align:center;}
.login-logo{font-family:'DM Serif Display',serif;font-size:24px;color:var(--charcoal);margin-bottom:0.5rem;}
.login-logo span{color:var(--amber);}
.login-sub{font-size:14px;color:var(--text-muted);margin-bottom:2rem;}
.login-status{font-size:14px;margin:1rem 0;}
.login-status.ok{color:var(--green);}
.login-status.err{color:var(--red);}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">Space<span>Logg</span></div>
  <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:1.5rem;">Owner Dashboard</div>
  <div id="status" class="login-sub">Verifying your access...</div>

  <!-- Manual login fallback -->
  <div id="manual-login" style="display:none;">
    <p class="login-sub">Sign in with your owner account</p>
    <form id="login-form">
      <div class="form-group"><input class="form-input" id="email" type="email" placeholder="Email" required/></div>
      <div class="form-group"><input class="form-input" id="password" type="password" placeholder="Password" required/></div>
      <div id="login-error" class="alert alert-error" style="display:none;"></div>
      <button type="submit" class="btn btn-amber" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>

<script>
const API = '/api';

async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (token) {
    // Magic link login
    try {
      // Verify token by calling /api/auth/me
      const res = await fetch(API + '/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Invalid link');
      const { user } = await res.json();
      if (user.role !== 'owner' && user.role !== 'admin') throw new Error('Not an owner account');
      localStorage.setItem('sl_token', token);
      localStorage.setItem('sl_user', JSON.stringify(user));
      document.getElementById('status').textContent = 'Welcome, ' + user.name + '! Redirecting...';
      document.getElementById('status').className = 'login-status ok';
      setTimeout(() => window.location.href = '/space-admin/', 1000);
    } catch (err) {
      document.getElementById('status').textContent = 'This link is expired or invalid. Please sign in below.';
      document.getElementById('status').className = 'login-status err';
      document.getElementById('manual-login').style.display = 'block';
    }
  } else {
    // Check if already logged in
    const existing = localStorage.getItem('sl_token');
    if (existing) {
      try {
        const res = await fetch(API + '/auth/me', { headers: { 'Authorization': 'Bearer ' + existing } });
        if (res.ok) {
          const { user } = await res.json();
          if (user.role === 'owner' || user.role === 'admin') {
            window.location.href = '/space-admin/';
            return;
          }
        }
      } catch {}
    }
    document.getElementById('status').style.display = 'none';
    document.getElementById('manual-login').style.display = 'block';
  }
}

document.getElementById('login-form')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (data.user.role !== 'owner' && data.user.role !== 'admin') throw new Error('This account is not an owner account');
    localStorage.setItem('sl_token', data.token);
    localStorage.setItem('sl_user', JSON.stringify(data.user));
    window.location.href = '/space-admin/';
  } catch (err) {
    errEl.style.display = 'block';
    errEl.textContent = err.message;
  }
});

init();
</script>
</body>
</html>
